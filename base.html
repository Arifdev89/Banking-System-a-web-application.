<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NeoBank{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --card: #1a1a24;
            --border: #2a2a38;
            --accent: #00e5a0;
            --accent2: #7c5cff;
            --danger: #ff4f6a;
            --warning: #ffb547;
            --text: #f0f0f8;
            --muted: #7a7a9a;
            --radius: 16px;
        }

        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--accent); text-decoration: none; }
        .nav-brand span { color: var(--text); }
        .nav-links { display: flex; gap: 0.25rem; align-items: center; }
        .nav-links a { color: var(--muted); text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
        .nav-links a:hover { color: var(--text); background: var(--card); }
        .nav-logout { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; transition: all 0.2s; text-decoration: none; }
        .nav-logout:hover { border-color: var(--danger); color: var(--danger); }

        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        .page-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 700; margin-bottom: 1.5rem; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }

        .messages { margin-bottom: 1.5rem; }
        .msg { padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .msg.success { background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.3); color: var(--accent); }
        .msg.error { background: rgba(255,79,106,0.1); border: 1px solid rgba(255,79,106,0.3); color: var(--danger); }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; font-weight: 500; }
        input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; transition: border-color 0.2s; outline: none; }
        input:focus { border-color: var(--accent); }

        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1.5rem; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: #0a0a0f; }
        .btn-primary:hover { background: #00ffb3; transform: translateY(-1px); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-full { width: 100%; }

        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .badge-green { background: rgba(0,229,160,0.15); color: var(--accent); }
        .badge-red { background: rgba(255,79,106,0.15); color: var(--danger); }
        .badge-purple { background: rgba(124,92,255,0.15); color: var(--accent2); }
        .badge-yellow { background: rgba(255,181,71,0.15); color: var(--warning); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 0.75rem 1rem; font-size: 0.8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
        td { padding: 1rem; font-size: 0.9rem; border-bottom: 1px solid rgba(42,42,56,0.5); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

{% if user.is_authenticated %}
<nav>
    <a href="{% url 'dashboard' %}" class="nav-brand">Neo<span>Bank</span></a>
    <div class="nav-links">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'deposit' %}">Deposit</a>
        <a href="{% url 'withdraw' %}">Withdraw</a>
        <a href="{% url 'transfer' %}">Transfer</a>
        <a href="{% url 'transactions' %}">History</a>
    </div>
    <a href="{% url 'logout' %}" class="nav-logout">Logout</a>
</nav>
{% endif %}

<div class="container">
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</div>

</body>
</html>
