{% extends 'banking/base.html' %}
{% block title %}Login - NeoBank{% endblock %}

{% block extra_css %}
<style>
    body { display: flex; align-items: center; justify-content: center; }
    .auth-wrap { width: 100%; max-width: 420px; }
    .auth-logo { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; color: var(--accent); text-align: center; margin-bottom: 0.5rem; }
    .auth-logo span { color: var(--text); }
    .auth-sub { text-align: center; color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
    .auth-link { text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--muted); }
    .auth-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-logo">Neo<span>Bank</span></div>
    <p class="auth-sub">Sign in to your account</p>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
    </div>
    <div class="auth-link">Don't have an account? <a href="{% url 'register' %}">Register</a></div>
</div>
{% endblock %}
